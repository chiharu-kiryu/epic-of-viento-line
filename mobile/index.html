<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Viento Studio</title>
  <link rel="stylesheet" href="/mobile/mobile.css"><link rel="stylesheet" href="/web/i18n/settings.css">
</head>
<body class="mobile-library">
  <header><div><h1>Viento Studio</h1><span>__VIENTO_VERSION__</span></div><button id="settingsBtn" data-i18n="设置"></button></header>
  <main>
    <h2 data-i18n="此设备上的作品"></h2>
    <p data-i18n="移动端预览版：可新建作品、编辑正文与字段，并自动保留编辑草稿。"></p>
    <p class="muted" data-i18n="项目包可在手机与桌面之间迁移；素材管理和模板配置仍在接入。"></p>
    <button id="importWorkspace" type="button" data-i18n="导入项目包"></button>
    <p class="muted" data-i18n="项目包包含已保存的正文、模板、元数据和素材；编辑草稿请先打开作品保存。"></p>
    <form id="createWorkspace"><label for="workspaceName" data-i18n="作品名称"></label><div class="create-row"><input id="workspaceName" maxlength="80" required autocomplete="off"><button type="submit" data-i18n="新建作品"></button></div></form>
    <p id="mobileStatus" role="status" aria-live="polite"></p>
    <button id="mobileRetry" type="button" hidden data-i18n="重试"></button>
    <div id="workspaces" class="mobile-works"></div>
    <p id="mobileEmpty" hidden data-i18n="还没有作品，可以新建或导入项目包。"></p>
  </main>
  <script type="module" src="/mobile/library.js"></script>
</body>
</html>
