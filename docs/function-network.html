"],"effect":"带请求 ID 读取忙碌与正文/模板草稿状态；有草稿时由宿主原生确认，批准后关闭窗口，等待引擎回收索引进程再释放会话锁。 原生确认按钮跟随应用语言，明确区分继续编辑与关闭并丢弃。","boundary":"状态查询 5 秒无响应或界面不完整时提供原生恢复确认，不自动丢弃。用户确认不超时；迟到回复无效，取消恢复输入，确认期间禁止新文件操作。","tests":["desktop/tests/native-smoke.py","scripts/tests/desktop-close.test.mjs","scripts/tests/desktop-workspace.test.mjs","src-tauri/src/close_state.rs","src-tauri/src/lib.rs","desktop/tests/native-library.py"]},{"id":"F08","group":"作品库与桌面","title":"导入完整项目包","entry":"作品库 → 导入迁移包","steps":["library","host","native_workspace","archive","manifest","documents","templates","document_meta","asset_meta","assets","local_config"],"effect":"先检查每层路径及 ZIP 清单，逐文件校验实际内容后核对登记的正文、素材指纹和绑定，再保留新恢复目录。","boundary":"已有编辑窗口时，首页禁用入口，宿主在原生选择器、写文件及登记前拒绝切换。只接受迁移格式；拒绝链接、大小写/Unicode 及文件目录冲突、未声明条目或不一致登记；失败清理本次恢复目录。","tests":["src-tauri/src/workspace.rs","desktop/tests/native-smoke.py","scripts/tests/export.test.mjs","desktop/tests/native-library.py","scripts/tests/desktop-library.test.mjs"]},{"id":"F09","group":"作品库与桌面","title":"作品库导出备份","entry":"最近作品 → 导出备份","steps":["library","host","native_workspace","documents","templates","document_meta","asset_meta","assets","archive"],"effect":"Rust 写入前固定文件快照与素材根，流式打包并核对正文/素材登记、内容指纹，复查文件与配置后原子发布。","boundary":"活动编辑窗口不妨碍备份已保存内容；取消或失败后可重试，其他项目入口仍保持禁用。与 Node 整库导出独立实现；不包含未保存草稿、缓存或本机绑定。拒绝跨系统路径冲突和缺失内容，失败保留旧备份。","tests":["src-tauri/src/workspace.rs","scripts/tests/export.test.mjs","desktop/tests/native-library.py","scripts/tests/desktop-library.test.mjs"]},{"id":"F10","group":"浏览与导航","title":"探测编辑能力和切换模式","entry":"编辑器加载 / 浏览、编辑按钮","steps":["editor","request","router","doc_service","editor"],"effect":"探测完整 capabilities 路径清单及 project 能力，失败时尝试 health，决定编辑与新建是否可用。","boundary":"浏览服务不提供写正文 API；浏览器模式选择不能突破后端能力。","tests":["scripts/tests/doc-api.test.mjs","scripts/tests/editor-runtime.test.mjs"]},{"id":"F11","group":"浏览与导航","title":"加载索引与重试","entry":"首次加载 / 重新加载按钮","steps":["editor","request","static","cache","editor","diagnostics"],"effect":"浏览与编辑均依次读取页面相对 data/index.json、/web/data/index.j ayout.test.mjs","line":138,"name":"reference indexes exclude fenced code examples while retaining bare IDs and explicit attachments"},{"file":"scripts/tests/workspace-layout.test.mjs","line":160,"name":"v1 registration retains workspace identity and the old manifest; unsupported versions do not mutate sources"},{"file":"scripts/tests/workspace-layout.test.mjs","line":185,"name":"ambiguous registry identities and unsafe paths fail before replacing existing metadata"},{"file":"scripts/tests/workspace-layout.test.mjs","line":199,"name":"registration refuses symlinked metadata directories without writing outside the workspace"},{"file":"scripts/tests/workspace-layout.test.mjs","line":209,"name":"read-only preview serves a separate workspace and refuses write requests"},{"file":"scripts/tests/workspace-layout.test.mjs","line":223,"name":"registration keeps a live lock and recovers a lock whose owner no longer exists"},{"file":"scripts/tests/workspace-layout.test.mjs","line":235,"name":"reusing a renamed asset alias cannot write a conflicting registry"},{"file":"scripts/tests/workspace-layout.test.mjs","line":253,"name":"automatic workspace names and manifests stay compatible with the native importer"},{"file":"scripts/tests/workspace-layout.test.mjs","line":266,"name":"image references support any asset folder and encoded filenames"},{"file":"scripts/tests/workspace-layout.test.mjs","line":280,"name":"custom standardization output cannot prune application files or an external asset store"}],"moduleHubs":[{"file":"scripts/lib/paths.mjs","consumers":33},{"file":"scripts/lib/doc-api-contract.mjs","consumers":13},{"file":"scripts/lib/workspace.mjs","consumers":13},{"file":"web/i18n/index.js","consumers":13},{"file":"scripts/lib/media-format.mjs","consumers":12},{"file":"scripts/lib/project-layout.mjs","consumers":12},{"file":"scripts/lib/scan-files.mjs","consumers":11},{"file":"scripts/lib/contained-path.mjs","consumers":9},{"file":"scripts/lib/process.mjs","consumers":7},{"file":"scripts/lib/doc-server.mjs","consumers":6}],"moduleImportCycles":[["web/modules/app-document-layout.js","web/modules/app-render.js","web/modules/app-structured.js"]]}</script>
<script>
'use strict';
const data=JSON.parse(document.getElementById('network-data').textContent);
const $=id=>document.getElementById(id);
const colors={'界面':'#3771c4','桌面':'#8467b4','服务':'#168777','引擎':'#b4812b','数据':'#627d9b','工具':'#68758e','兼容':'#ad6477'};
const byId=new Map(data.nodes.map(n=>[n.id,n]));
const state={mode:'flows',selected:'F18',query:'',group:'all'};
const esc=value=>String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const unique=values=>[...new Set(values)];
const sourceLink=(ref,label)=>`<a class="code-link" href="../${encodeURI(ref.file)}#L${ref.line||1}" target="_blank" rel="noopener">${esc(label||ref.symbol||ref.file)} <small>· ${esc(ref.file)}:${ref.line||1}</small></a>`;
const sourcePath=file=>({file,line:1});
const flowButton=(flow,label)=>`<button type="button" class="flow-ref" data-flow="${flow.id}"><span class="tag">${flow.id}</span> ${esc(label||flow.title)}</button>`;
const moduleButton=file=>`<button type="button" class="link-button" data-module="${esc(file)}">${esc(file)}</button>`;
const moduleFiles=data.sourceInventory.filter(f=>/\.m?js$/.test(f.path));
const apiGroups=[{id:'business',label:'业务 HTTP',rows:data.api},{id:'bridge',label:'桌面 HTTP 桥',rows:data.desktopBridge},{id:'native',label:'原生命令',rows:data.nativeCommands},{id:'cli',label:'作品维护 CLI',rows:data.workspaceCli}];
$('metrics').innerHTML=[[data.metadata.counts.workflows,'业务链路'],[data.nodes.length,'功能节点'],[data.moduleImports.length,'本地导入'],[data.api.length,'接口操作']].map(([n,label])=>`<div class="metric"><strong>${n}</strong><span>${label}</span></div>`).join('');
$('footer').textContent=`${data.metadata.version} · ${data.metadata.date} · 发布源码快照。业务箭头是步骤或数据交接；模块导入来自源码声明。网络为静态梳理；按图修复后已通过 ${data.metadata.verification.applicationTestsPassed} 项应用回归，测试使用临时作品。此页完全离线；文档不会随代码自动更新。`;

function items(){
  if(state.mode==='flows')return data.workflows.map(f=>({id:f.id,title:f.title,group:f.group,text:[f.id,f.title,f.group,f.entry,f.effect,f.boundary,...f.steps.map(id=>byId.get(id).label)].join(' ')}));
  if(state.mode==='nodes')return data.nodes.map(n=>({id:n.id,title:n.label,group:n.layer,text:[n.id,n.label,n.layer,n.description,...n.sources.map(s=>s.file)].join(' ')}));
  if(state.mode==='modules')return moduleFiles.map(f=>({id:f.path,title:f.path,group:f.path.split('/')[0],text:f.path}));
  return apiGroups.map(g=>({id:g.id,title:g.label,group:'接口类型',text:[g.label,...g.rows.flatMap(r=>[r.path||r.name,r.method||'',r.purpose||''])].join(' ')}));
}
function setupFilters(){
  $('search').value=state.query;
  $('search').placeholder=state.mode==='modules'?'搜索模块路径…':state.mode==='api'?'搜索接口、方法或命令…':'搜索保存、音频、导出…';
  $('group').innerHTML='<option value="all">全部</option>'+unique(items().map(i=>i.group)).map(g=>`<option value="${esc(g)}">${esc(g)}</option>`).join('');
  $('group').value=state.group;
}
function drawList(){
  const all=items();const query=state.query.trim().toLowerCase();
  const visible=all.filter(i=>(state.group==='all'||state.group===i.group)&&(!query||i.text.toLowerCase().includes(query)));
  $('count').textContent=`显示 ${visible.length} / ${all.length} 项`;
  let previous='';
  $('listing').innerHTML=visible.length?visible.map(i=>{
    const heading=i.group!==previous?`<div class="group-title">${esc(i.group)}</div>`:'';previous=i.group;
    const small=state.mode==='flows'?i.id:state.mode==='nodes'?i.id:state.mode==='api'?`${apiGroups.find(g=>g.id===i.id).rows.length} 个操作`:'';
    return heading+`<button type="button" data-select="${esc(i.id)}" aria-current="${i.id===state.selected}">${small?`<span class="small">${esc(small)}</span>`:''}${esc(i.title)}</button>`;
  }).join(''):'<div class="empty">没有匹配项。可清空搜索或切换范围。</div>';
}
function switchMode(mode,selected){
  state.mode=mode;state.group='all';state.query='';
  state.selected=selected||({flows:'F18',nodes:'parser',modules:'scripts/lib/project-layout.mjs',api:'business'})[mode];
  document.querySelectorAll('[data-mode]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.mode===mode)));
  setupFilters();drawList();drawDetail();setHash();
}
function setHash(){
  const hash=`${state.mode}/${encodeURIComponent(state.selected)}`;
  if(location.hash.slice(1)!==hash)history.replaceState(null,'','#'+hash);
}
function inspectNode(id){
  const node=byId.get(id);const related=data.workflows.filter(f=>f.steps.includes(id));
  $('node-inspector').innerHTML=`<div class="selected-info"><div class="subhead"><h3>${esc(node.label)}</h3><button type="button" class="back" data-node="${id}">查看上下游 →</button></div><p>${esc(node.description)}</p>${node.location?`<p class="muted">数据位置：${esc(node.location)}</p>`:''}<p class="muted">参与 ${related.length} 条已枚举业务链路</p>${node.sources.map(r=>sourceLink(r)).join('')}</div>`;
}
function drawFlow(flow){
  const refs=unique(flow.steps).flatMap(id=>byId.get(id).sources);
  const seen=new Set();const sources=refs.filter(r=>{const key=r.file+':'+r.line;if(seen.has(key))return false;seen.add(key);return true});
  $('detail').innerHTML=`<span class="tag">${flow.id} · ${esc(flow.group)}</span><h2>${esc(flow.title)}</h2><p class="entry">入口：${esc(flow.entry)}</p><p>${esc(flow.effect)}</p><h3>业务经过的节点</h3><p class="muted">点击节点查看职责与代码。箭头表示处理步骤或数据交接，具体条件见下方说明。</p><ol class="path">${flow.steps.map((id,i)=>{const n=byId.get(id);return `<li><button type="button" class="step" data-inspect="${id}" style="--node-color:${colors[n.layer]}"><span class="number">${String(i+1).padStart(2,'0')} · ${n.layer}</span><strong>${esc(n.label)}</strong></button></li>`}).join('')}</ol><div class="legend">${Object.entries(colors).map(([layer,color])=>`<span><i style="background:${color}"></i>${layer}</span>`).join('')}</div><div id="node-inspector"></div><div class="note"><strong>条件与边界</strong><br>${esc(flow.boundary)}</div><details><summary>这条链路的代码入口（${sources.length}）</summary>${sources.map(r=>sourceLink(r)).join('')}</details><h3>已有验证入口</h3><p class="muted">本轮应用回归通过 ${data.metadata.verification.applicationTestsPassed} 项；下列入口用于继续定位，原生窗口实测见保留的 b.2.8.1 报告，本轮升版未重跑。</p>${flow.tests.map(file=>sourceLink(sourcePath(file),file.split('/').pop())).join('')}`;
}
function neighbors(node,incoming){
  const edges=data.edges.filter(e=>(incoming?e.to:e.from)===node.id);
  if(!edges.length)return '<p class="muted">当前枚举中没有连接。</p>';
  return edges.map(e=>{const other=byId.get(incoming?e.from:e.to);return `<div class="neighbor"><button type="button" class="link-button" data-node="${other.id}">${esc(other.label)}</button><p class="muted">${incoming?'流向当前节点':'由当前节点流向'} · ${e.flows.length} 条链路</p>${e.flows.map(id=>flowButton(data.workflows.find(f=>f.id===id))).join('')}</div>`}).join('');
}
function drawNode(node){
  const related=data.workflows.filter(f=>f.steps.includes(node.id));
  $('detail').innerHTML=`<span class="tag">${node.layer} · ${node.id}</span><h2>${esc(node.label)}</h2><p>${esc(node.description)}</p>${node.location?`<div class="note">数据位置：${esc(node.location)}</div>`:''}<h3>实现位置</h3>${node.sources.map(r=>sourceLink(r)).join('')}<h3>经过此节点的业务（${related.length}）</h3><div class="summary-pills">${related.map(f=>`<button type="button" data-flow="${f.id}">${f.id} · ${esc(f.title)}</button>`).join('')}</div><div class="note">下列连接来自业务步骤枚举，不能当作直接函数调用。文件级真实导入可在“模块依赖”中查看。</div><div class="cols"><section><h3>上游 → ${esc(node.label)}</h3>${neighbors(node,true)}</section><section><h3>${esc(node.label)} → 下游</h3>${neighbors(node,false)}</section></div>`;
}
function drawModule(file){
  const incoming=data.moduleImports.filter(e=>e.to===file);const outgoing=data.moduleImports.filter(e=>e.from===file);
  const fileInfo=data.sourceInventory.find(f=>f.path===file);
  const cycle=data.moduleImportCycles.find(c=>c.includes(file));
  function cards(edges,direction){return edges.length?edges.map(e=>`<div class="module-card">${moduleButton(direction==='in'?e.from:e.to)}<p class="muted">${esc(e.kind)} · ${esc((e.symbols||[]).join(', ')||'副作用导入')}</p>${e.generatedPath?`<p class="muted">构建生成路径：${esc(e.generatedPath)}</p>`:''}<a href="../${encodeURI(e.from)}#L${e.line}" target="_blank" rel="noopener">查看导入语句 · 第 ${e.line} 行</a></div>`).join(''):'<p class="muted">无本地模块导入记录。</p>'}
  const related=data.nodes.filter(n=>n.sources.some(s=>s.file===file));
  $('detail').innerHTML=`<span class="tag">实际 ESM 导入关系</span><h2 class="mono-title">${esc(file)}</h2><p class="muted">${fileInfo?.lines||'—'} 行 · ${unique(incoming.map(e=>e.from)).length} 个不同导入方 · ${unique(outgoing.map(e=>e.to)).length} 个不同本地依赖</p>${sourceLink(sourcePath(file),'打开源文件')}<div class="module-center"><div class="metric-label">方向约定</div><p>导入方 → 当前模块 → 当前模块导入的依赖</p><p class="module-summary">左侧 ${incoming.length} 条语句 / 右侧 ${outgoing.length} 条语句；含测试代码，同一文件对可能有多条语句。</p></div>${cycle?`<div class="note">当前模块位于一个互相导入的组：${cycle.map(esc).join('、')}。循环依赖本身不能证明运行时故障。</div>`:''}${related.length?`<h3>对应功能节点</h3><div class="summary-pills">${related.map(n=>`<button type="button" data-node="${n.id}">${esc(n.label)}</button>`).join('')}</div>`:''}<div class="module-grid"><section><h3>谁导入了它 →</h3>${cards(incoming,'in')}</section><section><h3>→ 它导入了谁</h3>${cards(outgoing,'out')}</section></div><div class="note">仅枚举相对 ESM 声明与字面量动态导入。运行时计算路径、HTML/CSS 资源链接、Rust crate 关系和第三方库内部未在此图展开。</div>`;
}
function drawAPI(id){
  const group=apiGroups.find(g=>g.id===id);const q=state.query.trim().toLowerCase();
  const rows=group.rows.filter(r=>!q||[r.path||r.name,r.method||'',r.purpose||'',group.label].join(' ').toLowerCase().includes(q));
  const descriptions={business:'编辑服务共有 11 个业务路径、16 个方法组合。浏览服务也支持导出；其他业务 API 仅在编辑服务开放。',bridge:'编辑窗口通过受限的本机会话桥，把显示作品库、语言、导出保存和关闭回复交给宿主。',native:'仅作品库首页 main 窗口可调用；编辑网页不直接取得这些原生命令权限。',cli:'从 npm run workspace -- <命令> 进入，均可用 --root 明确作品根。归档示例 CLI 另有 create / export / import / verify。'};
  const cliInfo={paths:'显示配置、数据和作品路径',register:'增量登记；会写入元数据',verify:'校验登记与素材', 'migrate-documents':'预览旧文档归属；--write 提交', 'check-project':'校验模板及登记', 'apply-definition':'采用项目定义；--write 提交', 'bind-assets':'写本机素材根绑定'};
  $('detail').innerHTML=`<span class="tag">接口与命令</span><h2>${esc(group.label)}</h2><p>${esc(descriptions[id])}</p><p class="muted api-search-result">显示 ${rows.length} / ${group.rows.length} 个操作</p><div class="table-wrap"><table><thead><tr><th>方法 / 命令</th><th>路径 / 用途</th><th>代码</th></tr></thead><tbody>${rows.map(r=>`<tr><td><code>${esc(r.method||r.name)}</code>${r.servers?`<p class="muted">${r.servers.includes('browse')?'编辑、浏览':'编辑'}</p>`:''}</td><td>${r.path?`<code>${esc(r.path)}</code>`:''}<p>${esc(r.purpose||cliInfo[r.name])}</p></td><td><a href="../${encodeURI(r.file)}#L${r.line||1}" target="_blank" rel="noopener">${esc(r.handler||r.file.split('/').pop())}:${r.line||1}</a></td></tr>`).join('')}</tbody></table></div>${id==='business'?'<div class="note">/api/index 是轻量文件目录，不是界面读取的完整展示索引。能力声明已补齐项目配置和预览路径；此表与实际路由一致。</div>':''}<h3>关联业务</h3>${data.workflows.filter(f=>id==='business'?['F11','F18','F25','F28','F33','F50'].includes(f.id):id==='bridge'?['F04','F06','F07','F34','F36'].includes(f.id):id==='native'?f.group==='作品库与桌面':['F39','F40','F41','F42','F43'].includes(f.id)).map(f=>flowButton(f)).join('')}`;
}
function drawDetail(){
  if(state.mode==='flows')drawFlow(data.workflows.find(f=>f.id===state.selected));
  else if(state.mode==='nodes')drawNode(byId.get(state.selected));
  else if(state.mode==='modules')drawModule(state.selected);
  else drawAPI(state.selected);
}
document.addEventListener('click',event=>{
  const button=event.target.closest('button');if(!button)return;
  if(button.dataset.mode){switchMode(button.dataset.mode);return}
  if(button.dataset.select){state.selected=button.dataset.select;drawList();drawDetail();setHash();return}
  if(button.dataset.inspect){inspectNode(button.dataset.inspect);return}
  if(button.dataset.flow){switchMode('flows',button.dataset.flow);return}
  if(button.dataset.node){switchMode('nodes',button.dataset.node);return}
  if(button.dataset.module){switchMode('modules',button.dataset.module);return}
});
$('search').addEventListener('input',event=>{state.query=event.target.value;drawList();if(state.mode==='api')drawDetail()});
$('group').addEventListener('change',event=>{state.group=event.target.value;drawList()});
function restoreHash(){
  const match=location.hash.slice(1).match(/^(flows|nodes|modules|api)\/(.+)$/);
  if(!match)return false;
  let selected;try{selected=decodeURIComponent(match[2])}catch{return false}
  const [_,mode]=match;const valid=mode==='flows'?data.workflows.some(f=>f.id===selected):mode==='nodes'?byId.has(selected):mode==='modules'?moduleFiles.some(f=>f.path===selected):apiGroups.some(g=>g.id===selected);
  if(!valid)return false;switchMode(mode,selected);return true;
}
window.addEventListener('hashchange',()=>restoreHash());
if(!restoreHash())switchMode('flows','F18');
</script>
</body>
</html>
