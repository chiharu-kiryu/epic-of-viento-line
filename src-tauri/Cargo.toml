[package]
name = "viento-studio"
version = "0.3.5"
description = "Viento 文档与故事编辑器"
edition = "2021"
rust-version = "1.85"

[lib]
name = "viento_studio"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
rfd = { version = "0.16", default-features = false, features = ["gtk3"] }
tauri-plugin-shell = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
sha2 = "0.10"
unicode-normalization = "0.1.25"
zip = { version = "4", default-features = false, features = ["deflate"] }
tempfile = "3"
fs2 = "0.4"
tokio = { version = "1", features = ["sync", "time"] }

[target.'cfg(target_os = "linux")'.dev-dependencies]
glib = "=0.18.5"

# GTK3 still requires glib 0.18. Apply the upstream RUSTSEC-2024-0429 fix
# locally for every transitive GTK/WebKit consumer. See vendor/README.md.
[patch.crates-io]
glib = { path = "vendor/glib" }

# The advisory's invalid immutable out-pointer can fail only after optimization.
# Keep the dependency optimized even in the normal desktop regression suite.
[profile.test.package.glib]
opt-level = 3
