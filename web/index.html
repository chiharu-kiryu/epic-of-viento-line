<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Epic of Viento Line · b.3.3</title>
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="stylesheet" href="/web/styles.css" />
    <link rel="stylesheet" href="/web/editor-layout.css" />
    <link rel="stylesheet" href="/web/i18n/settings.css" />
  </head>
  <body>
    <div id="workspaceShell" class="page-shell">
      <header class="topbar">
        <div class="topbar-inner">
          <div class="topbar-identity">
            <button id="docSidebarToggleBtn" class="doc-sidebar-toggle" type="button" aria-controls="docSidebar" aria-expanded="true" hidden>
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M9 4v16"/></svg>
              <span id="docSidebarToggleLabel" data-i18n="收起目录">收起目录</span>
            </button>
            <div class="brand">
              <div class="brand-badge">V</div>
              <div class="brand-copy">
                <h1 id="siteTitle">Viento Studio</h1>
                <p id="siteSubtitle" data-i18n="角色、故事与世界设定">角色、故事与世界设定</p>
              </div>
              <span id="appVersion" class="release-version">b.4.5</span>
            </div>
          </div>
          <nav id="topbarNav" class="topbar-nav" aria-label="—">
            <a id="navCatalogLink" href="#" aria-current="page">—</a>
            <a id="navHeroLink" href="#">—</a>
            <a id="navItemLink" href="#">—</a>
            <a id="navUnitLink" href="#">—</a>
          </nav>
          <div id="modeSwitch" class="topbar-mode" role="group" aria-label="—">
            <button id="settingsBtn" type="button" class="doc-btn doc-btn-ghost" data-i18n="设置">设置</button>
            <button id="projectSettingsBtn" type="button" class="doc-btn doc-btn-ghost" data-i18n="项目类型与模板">项目类型与模板</button>
            <button id="docExportBtn" type="button" class="doc-btn doc-btn-ghost" data-i18n="导出">导出</button>
            <button id="modeBrowseBtn" type="button" class="mode-btn mode-btn-active" data-mode="browse">—</button>
            <button id="modeEditBtn" type="button" class="mode-btn" data-mode="edit">—</button>
            <span id="modeStateChip" class="mode-state" aria-live="polite">—</span>
          </div>
        </div>
      </header>
      <main class="layout">
        <button id="docSidebarBackdrop" type="button" class="doc-sidebar-backdrop" aria-label="收起文档目录" data-i18n-aria-label="收起文档目录" tabindex="-1" hidden></button>
        <aside id="docSidebar" class="left" aria-label="文档目录" data-i18n-aria-label="文档目录">
          <div class="left-shell">
            <div class="toolbar">
              <div class="search-wrap">
                <input id="searchInput" type="text" placeholder="—" />
                <button id="searchClear" type="button" class="search-clear" aria-label="—" title="—">×</button>
              </div>
              <div id="categoryTabs" class="tabs" role="tablist" aria-label="—"></div>
              <div class="status-row">
                <div id="status" class="status">—</div>
                <button id="docLoadRetryBtn" type="button" class="doc-btn doc-btn-ghost doc-btn-small is-hidden" hidden>—</button>
              </div>
              <div id="runtimeErrorPanel" class="runtime-error-panel is-hidden" hidden>
                <div class="runtime-error-panel-head">
                  <span id="runtimeErrorPanelTitle">—</span>
                  <button id="runtimeErrorClearBtn" type="button" class="doc-btn doc-btn-ghost doc-btn-small" aria-label="—">—</button>
                </div>
                <div id="runtimeErrorList" class="runtime-error-list"></div>
              </div>
            </div>
            <div id="leftStats" class="left-stats" aria-label="—">
              <article class="left-stat-card">
                <div id="leftTotalStat" class="left-stat-value">—</div>
                <div id="leftTotalStatLabel" class="left-stat-label">—</div>
              </article>
              <article class="left-stat-card">
                <div id="leftVisibleStat" class="left-stat-value">—</div>
                <div id="leftVisibleStatLabel" class="left-stat-label">—</div>
              </article>
            </div>
            <div id="leftLegend" class="left-legend" aria-label="—">
              <div id="leftLegendTitle" class="left-legend-title">—</div>
              <div id="leftLegendBody" class="left-legend-body"></div>
            </div>
          </div>
          <div id="docList" class="doc-list">—</div>
        </aside>
        <section class="right">
          <div class="content-frame">
            <div class="doc-meta">
              <div class="doc-heading">
                <div id="docMetaStrip" class="doc-meta-strip">
                  <span id="docTypeChip" class="doc-chip">—</span>
                  <span id="docGroupChip" class="doc-chip">—</span>
                  <span id="docPathChip" class="doc-chip">—</span>
                </div>
                <div id="docTitle" class="doc-title">—</div>
                <div class="doc-create-title" data-i18n="新建文档">新建文档</div>
                <div id="docSubtitle" class="doc-subtitle">—</div>
              </div>
              <div id="docEditPanel" class="doc-edit-panel is-hidden">
                <div class="doc-edit-toolbar">
                  <div id="docEditModeBar" class="doc-edit-mode-bar is-hidden" role="group" aria-label="编辑方式" data-i18n-aria-label="编辑方式">
                    <button id="docEditSourceModeBtn" type="button" class="doc-btn doc-btn-ghost doc-btn-active" data-mode="source" aria-pressed="true">—</button>
                    <button id="docEditBlockModeBtn" type="button" class="doc-btn doc-btn-ghost" data-mode="blocks" aria-pressed="false">—</button>
                    <button id="docEditFieldModeBtn" type="button" class="doc-btn doc-btn-ghost" data-mode="fields" aria-pressed="false" data-i18n="字段编辑">字段编辑</button>
                  </div>
                  <div id="docEditActions" class="doc-edit-actions">
                    <button id="docCreateBtn" type="button" class="doc-btn doc-btn-ghost">—</button>
                    <button id="docEditBtn" type="button" class="doc-btn">—</button>
                    <button id="docCancelBtn" type="button" class="doc-btn doc-btn-ghost">—</button>
                    <button id="docMediaInsertBtn" type="button" class="doc-btn doc-btn-ghost" hidden data-i18n="插入素材">插入素材</button>
                    <button id="docRebuildBtn" type="button" class="doc-btn doc-btn-ghost">—</button>
                    <button id="docSaveBtn" type="button" class="doc-btn doc-btn-success" aria-keyshortcuts="Control+s Meta+s Control+Enter Meta+Enter">—</button>
                  </div>
                </div>
                <div class="doc-edit-location">
                  <div id="docEditPath" class="doc-edit-path muted">—</div>
                </div>
                <div class="doc-create-fields">
                  <div id="docCreateTypeWrap" class="doc-create-type-wrap is-hidden">
                    <label id="docCreateTypeLabel" for="docCreateTypeSelect" class="doc-create-type-label">—</label>
                    <select id="docCreateTypeSelect" class="doc-create-type-select">
                      <option value="document" data-i18n="档案">档案</option>
                    </select>
                  </div>
                  <div id="docCreatePathWrap" class="doc-create-path-wrap is-hidden">
                    <label id="docCreatePathLabel" for="docCreatePathInput" class="doc-create-path-label">—</label>
                    <input id="docCreatePathInput" class="doc-create-path-input" type="text" placeholder="—" autocomplete="off" spellcheck="false" />
                  </div>
                </div>
                <div class="doc-editor-surface">
                  <div id="docBlockEditor" class="doc-block-editor is-hidden" aria-label="分段编辑" data-i18n-aria-label="分段编辑"></div>
                  <div id="docFieldEditor" class="doc-field-editor is-hidden" aria-label="字段编辑" data-i18n-aria-label="字段编辑"></div>
                  <div id="docEditorWrap" class="doc-editor-wrap">
                    <textarea id="docSourceEditor" class="doc-editor" rows="14" spellcheck="false" aria-label="文档源码" data-i18n-aria-label="文档源码" placeholder="—"></textarea>
                  </div>
                  <section id="docMediaPreview" class="doc-media-preview" aria-label="草稿中的素材预览" data-i18n-aria-label="草稿中的素材预览" hidden></section>
                </div>
                <div class="doc-edit-footer">
                  <div class="doc-edit-feedback">
                    <span id="docEditDirtyIndicator" class="doc-edit-dirty-indicator is-hidden" aria-live="polite">—</span>
                    <div id="docEditStatus" class="doc-edit-status" role="status" aria-live="polite"></div>
                  </div>
                  <div class="doc-edit-support">
                    <span id="docEditMetrics" class="doc-edit-metrics"></span>
                    <span class="doc-edit-shortcut"><kbd>Ctrl / ⌘</kbd> + <kbd>S</kbd> <span data-i18n="保存">保存</span></span>
                  </div>
                </div>
              </div>
            </div>
            <div id="heroBanner" class="hero-banner"></div>
            <div id="metaCards" class="meta-grid"></div>
            <div id="sectionCards" class="meta-grid"></div>
            <div id="heroGallery" class="gallery"></div>
            <pre id="docContent" class="content">—</pre>
          </div>
        </section>
      </main>
    </div>
    <dialog id="docExportDialog" class="doc-media-dialog doc-export-dialog" aria-labelledby="docExportTitle">
      <div class="doc-media-dialog-heading">
        <h2 id="docExportTitle" data-i18n="导出作品">导出作品</h2>
        <button id="docExportCloseBtn" type="button" class="doc-btn doc-btn-ghost" data-i18n="关闭">关闭</button>
      </div>
      <p id="docExportContext" class="muted"></p>
      <fieldset id="docExportOptions" class="doc-export-options">
        <legend data-i18n="导出用途">导出用途</legend>
        <label class="doc-export-choice"><input type="radio" name="exportKind" value="document" checked><span><strong data-i18n="文档分享">文档分享</strong><small data-i18n="当前档案与引用的图片、视频、音频，打包后便于分享。">当前档案与引用的图片、视频、音频，打包后便于分享。</small></span></label>
        <label class="doc-export-choice"><input type="radio" name="exportKind" value="workspace"><span><strong data-i18n="完整项目包">完整项目包</strong><small data-i18n="全部正文、模板、元数据和素材，可在作品库中导入恢复。">全部正文、模板、元数据和素材，可在作品库中导入恢复。</small></span></label>
        <div id="docExportDocumentOptions" class="doc-export-document-options">
          <label for="docExportFormat" data-i18n="分享格式">分享格式</label>
          <select id="docExportFormat"><option value="html" data-i18n="离线网页 · 解压后打开阅读">离线网页 · 解压后打开阅读</option><option value="markdown" data-i18n="Markdown · 继续编辑或交给其他工具">Markdown · 继续编辑或交给其他工具</option></select>
          <label class="doc-export-children"><input id="docExportChildren" type="checkbox" checked><span data-i18n="包含附属内容（如角色背景故事）">包含附属内容（如角色背景故事）</span></label>
        </div>
      </fieldset>
      <p id="docExportHint" class="muted" data-i18n="导出已保存的内容，图片、视频与音频会一起打包。原始项目保留在原处。">导出已保存的内容，图片、视频与音频会一起打包。原始项目保留在原处。</p>
      <p id="docExportMessage" class="doc-media-message" role="status" aria-live="polite"></p>
      <div class="doc-export-actions">
        <button id="docExportStartBtn" type="button" class="doc-btn doc-btn-success" data-i18n="开始导出">开始导出</button>
        <button id="docExportDownload" type="button" class="doc-btn doc-btn-success" hidden data-i18n="下载文件">下载文件</button>
        <button id="docExportSaveBtn" type="button" class="doc-btn doc-btn-success" hidden data-i18n="选择保存位置">选择保存位置</button>
        <button id="docExportCancelBtn" type="button" class="doc-btn doc-btn-ghost" hidden data-i18n="取消导出">取消导出</button>
      </div>
    </dialog>
    <dialog id="docMediaDialog" class="doc-media-dialog" aria-labelledby="docMediaDialogTitle">
      <div class="doc-media-dialog-heading">
        <h2 id="docMediaDialogTitle" data-i18n="插入图片、视频或音频">插入图片、视频或音频</h2>
        <button id="docMediaCloseBtn" type="button" class="doc-btn doc-btn-ghost" aria-label="关闭素材窗口" data-i18n-aria-label="关闭素材窗口" data-i18n="关闭">关闭</button>
      </div>
      <p class="muted" data-i18n="导入的文件保存在当前作品的素材目录中，可以在其他档案里复用。也可以直接粘贴图片，或将文件拖入编辑区。">导入的文件保存在当前作品的素材目录中，可以在其他档案里复用。也可以直接粘贴图片，或将文件拖入编辑区。</p>
      <div class="doc-media-picker-actions">
        <button id="docMediaImportBtn" type="button" class="doc-btn doc-btn-success" data-i18n="从电脑导入">从电脑导入</button>
        <input id="docMediaFileInput" type="file" accept=".png,.jpg,.jpeg,.webp,.gif,.svg,.mp4,.webm,.mov,.mp3,.wav,.ogg,.oga,.opus,.flac,.m4a,.aac" multiple hidden />
        <span class="muted" data-i18n="单个文件最多 256 MB">单个文件最多 256 MB</span>
      </div>
      <div class="doc-media-filter">
        <input id="docMediaSearch" type="search" placeholder="搜索图片、视频或音频" data-i18n-placeholder="搜索图片、视频或音频" aria-label="搜索作品素材" data-i18n-aria-label="搜索作品素材" />
        <select id="docMediaKind" aria-label="素材类型" data-i18n-aria-label="素材类型"><option value="" data-i18n="全部素材">全部素材</option><option value="image" data-i18n="图片">图片</option><option value="video" data-i18n="视频">视频</option><option value="audio" data-i18n="音频">音频</option></select>
      </div>
      <p id="docMediaMessage" class="doc-media-message" role="status" aria-live="polite"></p>
      <div class="doc-media-progress-row">
        <progress id="docMediaProgress" max="100" value="0" hidden></progress>
        <span id="docMediaProgressLabel" hidden></span>
        <button id="docMediaAbortBtn" type="button" class="doc-btn doc-btn-ghost" hidden data-i18n="取消导入">取消导入</button>
      </div>
      <div id="docMediaList" class="doc-media-list" aria-label="作品素材" data-i18n-aria-label="作品素材"></div>
      <button id="docMediaMoreBtn" type="button" class="doc-btn doc-btn-ghost" hidden data-i18n="显示更多">显示更多</button>
    </dialog>
    <div id="docSaveConflictDialog" class="doc-conflict-overlay is-hidden" role="dialog" aria-modal="true" aria-labelledby="docSaveConflictDialogTitle" aria-describedby="docSaveConflictDialogMessage">
      <div class="doc-conflict-backdrop"></div>
        <div class="doc-conflict-dialog" role="document">
        <h3 id="docSaveConflictDialogTitle" class="doc-conflict-title">—</h3>
        <p id="docSaveConflictDialogMessage" class="doc-conflict-message"></p>
        <div id="docSaveConflictDialogWarning" class="doc-conflict-warning is-hidden" aria-live="polite"></div>
        <div class="doc-conflict-actions">
          <button id="docSaveConflictReloadBtn" type="button" class="doc-btn doc-btn-ghost" data-save-conflict-action="1">—</button>
          <button id="docSaveConflictKeepBtn" type="button" class="doc-btn" data-save-conflict-action="2">—</button>
          <button id="docSaveConflictForceBtn" type="button" class="doc-btn doc-btn-danger" data-save-conflict-action="3">—</button>
          <button id="docSaveConflictCancelBtn" type="button" class="doc-btn doc-btn-ghost" data-save-conflict-action="cancel">—</button>
        </div>
      </div>
    </div>
    <script type="module" src="/web/app.js"></script>
    <script type="module" src="/web/modules/desktop-bridge.js"></script>
  </body>
</html>
